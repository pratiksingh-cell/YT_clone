<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center fixed w-full top-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-red-600">YouTube Clone</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="studio.html" class="hidden md:block bg-gray-200 px-4 py-2 rounded-full hover:bg-gray-300">Studio (Upload)</a>
            <div id="auth-section">
                <button id="login-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Sign In</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 p-4 max-w-7xl mx-auto">
        <div id="video-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Videos will load here -->
        </div>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
