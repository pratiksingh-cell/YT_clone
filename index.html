<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        /* Hide scrollbar for category pills */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white antialiased selection:bg-red-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#0f0f0f]/95 backdrop-blur-md h-14 px-4 flex justify-between items-center fixed w-full top-0 z-50 border-b border-white/10">
        
        <!-- Left: Menu & Logo -->
        <div class="flex items-center gap-4">
            <button id="sidebar-toggle" class="p-2 rounded-full hover:bg-white/10 transition" aria-label="Toggle Menu">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <a href="index.html" class="flex items-center gap-1.5 group">
                <div class="bg-red-600 text-white p-1.5 rounded-lg group-hover:bg-red-500 transition">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight">YouTube</span>
                <span class="text-[10px] text-gray-400 self-start mt-1 font-medium">IN</span>
            </a>
        </div>

        <!-- Center: Search Bar -->
        <div class="flex-1 max-w-2xl mx-4 hidden sm:flex items-center">
            <form id="search-form" class="flex w-full items-center" onsubmit="event.preventDefault();">
                <div class="relative flex w-full items-center">
                    <input 
                        id="search-input" 
                        type="text" 
                        placeholder="Search videos, channels..." 
                        autocomplete="off"
                        class="w-full bg-[#121212] text-white placeholder-gray-400 pl-4 pr-10 py-2 rounded-l-full border border-[#303030] focus:border-blue-500 focus:outline-none focus:ring-0 text-sm transition"
                    />
                    <!-- Clear Search Button -->
                    <button 
                        type="button" 
                        id="clear-search-btn" 
                        class="hidden absolute right-3 text-gray-400 hover:text-white"
                        aria-label="Clear search"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <button 
                    type="submit" 
                    id="search-btn" 
                    class="bg-[#222222] hover:bg-[#303030] px-5 py-2 rounded-r-full border border-l-0 border-[#303030] transition flex items-center justify-center"
                    title="Search"
                >
                    <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Right: Studio Link & Auth Section -->
        <div class="flex items-center gap-3">
            <!-- Mobile Search Toggle -->
            <button id="mobile-search-toggle" class="sm:hidden p-2 rounded-full hover:bg-white/10 transition" aria-label="Search">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
                </svg>
            </button>

            <!-- Studio (Upload) Button -->
            <a href="studio.html" class="flex items-center gap-2 bg-[#222222] hover:bg-[#303030] border border-white/10 text-sm font-medium px-3.5 py-1.5 rounded-full transition">
                <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                <span class="hidden md:inline">Studio (Upload)</span>
            </a>

            <!-- Auth Section (Preserved IDs for js/auth.js) -->
            <div id="auth-section" class="flex items-center">
                <button id="login-btn" class="flex items-center gap-2 text-blue-400 hover:bg-blue-500/10 border border-white/20 px-3.5 py-1.5 rounded-full text-sm font-medium transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>Sign In</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Search Bar Overlay -->
    <div id="mobile-search-bar" class="hidden fixed top-0 left-0 w-full h-14 bg-[#0f0f0f] z-50 px-3 flex items-center gap-2 border-b border-white/10">
        <button id="mobile-search-back" class="p-2 rounded-full hover:bg-white/10">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <input 
            id="mobile-search-input" 
            type="text" 
            placeholder="Search YouTube..." 
            class="flex-1 bg-[#222222] text-white placeholder-gray-400 px-4 py-1.5 rounded-full border border-[#303030] focus:border-blue-500 focus:outline-none text-sm"
        />
    </div>

    <!-- Layout Wrapper -->
    <div class="flex pt-14">
        
        <!-- Left Sidebar (Desktop) -->
        <aside id="sidebar" class="hidden lg:flex flex-col w-60 fixed left-0 top-14 bottom-0 bg-[#0f0f0f] px-3 py-3 overflow-y-auto border-r border-white/5 select-none z-40">
            <div class="space-y-1">
                <a href="index.html" class="flex items-center gap-5 px-3 py-2.5 rounded-xl bg-white/10 font-medium text-sm text-white">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="studio.html" class="flex items-center gap-5 px-3 py-2.5 rounded-xl hover:bg-white/10 font-normal text-sm text-gray-300 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
                    </svg>
                    <span>YouTube Studio</span>
                </a>
            </div>

            <hr class="my-3 border-white/10" />

            <div class="px-3 py-2 text-xs text-gray-400 space-y-2">
                <p class="font-medium text-gray-300">Unlisted YouTube Hub</p>
                <p>Videos hosted via unlisted YouTube embeds & synced with Firebase.</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 lg:ml-60 min-h-screen">
            
            <!-- Sticky Category Filter Pills -->
            <div class="sticky top-14 z-30 bg-[#0f0f0f]/95 backdrop-blur-md px-4 md:px-6 py-3 border-b border-white/5 flex items-center gap-3 overflow-x-auto no-scrollbar">
                <button class="category-pill active bg-white text-black font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="all">
                    All
                </button>
                <button class="category-pill bg-[#222222] hover:bg-[#303030] text-gray-200 font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="music">
                    Music
                </button>
                <button class="category-pill bg-[#222222] hover:bg-[#303030] text-gray-200 font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="gaming">
                    Gaming
                </button>
                <button class="category-pill bg-[#222222] hover:bg-[#303030] text-gray-200 font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="tech">
                    Tech & Coding
                </button>
                <button class="category-pill bg-[#222222] hover:bg-[#303030] text-gray-200 font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="education">
                    Education
                </button>
                <button class="category-pill bg-[#222222] hover:bg-[#303030] text-gray-200 font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="vlogs">
                    Vlogs
                </button>
                <button class="category-pill bg-[#222222] hover:bg-[#303030] text-gray-200 font-medium text-sm px-3.5 py-1.5 rounded-lg whitespace-nowrap transition" data-category="entertainment">
                    Entertainment
                </button>
            </div>

            <!-- Search Status Banner (Hidden by default) -->
            <div id="search-status" class="hidden px-4 md:px-6 pt-4 flex items-center justify-between text-sm text-gray-400">
                <span>Showing results for: <strong id="search-query-text" class="text-white"></strong></span>
                <button id="reset-search-btn" class="text-blue-400 hover:underline">Reset</button>
            </div>

            <!-- Video Grid Container (Preserved #video-grid ID for js/app.js) -->
            <div class="p-4 md:p-6">
                <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-8">
                    <!-- Videos will load here dynamically from js/app.js -->
                </div>

                <!-- Empty No-Results State for Search -->
                <div id="no-search-results" class="hidden flex-col items-center justify-center py-20 text-center">
                    <svg class="w-16 h-16 text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
                    </svg>
                    <h3 class="text-lg font-medium text-gray-200">No matching videos found</h3>
                    <p class="text-sm text-gray-400 mt-1">Try searching for a different keyword or title.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Built-in UI & Live Search Filtering Script (Works automatically alongside js/app.js) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const mobileSearchInput = document.getElementById('mobile-search-input');
            const clearSearchBtn = document.getElementById('clear-search-btn');
            const searchStatus = document.getElementById('search-status');
            const searchQueryText = document.getElementById('search-query-text');
            const resetSearchBtn = document.getElementById('reset-search-btn');
            const videoGrid = document.getElementById('video-grid');
            const noResults = document.getElementById('no-search-results');
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const mobileSearchToggle = document.getElementById('mobile-search-toggle');
            const mobileSearchBar = document.getElementById('mobile-search-bar');
            const mobileSearchBack = document.getElementById('mobile-search-back');
            const categoryPills = document.querySelectorAll('.category-pill');

            // 1. Live DOM Search Filter (Automatically filters video cards rendered inside #video-grid)
            function filterVideos(rawQuery) {
                const query = rawQuery.trim().toLowerCase();
                const cards = Array.from(videoGrid.children);

                if (query.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                    searchStatus.classList.remove('hidden');
                    searchQueryText.textContent = `"${rawQuery.trim()}"`;
                } else {
                    clearSearchBtn.classList.add('hidden');
                    searchStatus.classList.add('hidden');
                }

                let visibleCount = 0;
                cards.forEach(card => {
                    const text = card.textContent.toLowerCase();
                    if (text.includes(query)) {
                        card.style.display = '';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (cards.length > 0 && visibleCount === 0) {
                    noResults.classList.remove('hidden');
                    noResults.classList.add('flex');
                } else {
                    noResults.classList.add('hidden');
                    noResults.classList.remove('flex');
                }
            }

            searchInput.addEventListener('input', (e) => {
                mobileSearchInput.value = e.target.value;
                filterVideos(e.target.value);
            });

            mobileSearchInput.addEventListener('input', (e) => {
                searchInput.value = e.target.value;
                filterVideos(e.target.value);
            });

            function clearSearch() {
                searchInput.value = '';
                mobileSearchInput.value = '';
                filterVideos('');
                searchInput.focus();
            }

            clearSearchBtn.addEventListener('click', clearSearch);
            resetSearchBtn.addEventListener('click', clearSearch);

            // 2. Category Pill Filtering
            categoryPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    categoryPills.forEach(p => {
                        p.classList.remove('bg-white', 'text-black');
                        p.classList.add('bg-[#222222]', 'text-gray-200');
                    });
                    pill.classList.remove('bg-[#222222]', 'text-gray-200');
                    pill.classList.add('bg-white', 'text-black');

                    const category = pill.getAttribute('data-category');
                    if (category === 'all') {
                        clearSearch();
                    } else {
                        searchInput.value = pill.textContent.trim();
                        filterVideos(pill.textContent.trim());
                    }
                });
            });

            // 3. Sidebar Collapse Toggle
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('lg:hidden');
                mainContent.classList.toggle('lg:ml-60');
            });

            // 4. Mobile Search Bar Overlay Toggle
            mobileSearchToggle.addEventListener('click', () => {
                mobileSearchBar.classList.remove('hidden');
                mobileSearchInput.focus();
            });

            mobileSearchBack.addEventListener('click', () => {
                mobileSearchBar.classList.add('hidden');
            });
        });
    </script>

    <!-- Existing Firebase & App Modules -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
